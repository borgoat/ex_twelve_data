name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LANG: C.UTF-8

defaults:
  run:
    # Same toolchain as local development: every step runs inside the flake's devshell.
    shell: nix develop --command bash -euo pipefail {0}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Empty on fork PRs, which skips the live API test.
      TWELVEDATA_APIKEY: ${{ secrets.TWELVEDATA_APIKEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # .nix-mix holds Hex, rebar and the dialyzer core PLT.
          path: |
            deps
            _build
            .nix-mix
          key: mix-${{ runner.os }}-${{ hashFiles('flake.lock', 'mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - run: mix deps.get
      - run: mix format --check-formatted
      # --force: a restored _build would skip (and not warn about) unchanged files.
      - run: mix compile --warnings-as-errors --force
      - run: mix credo --strict
      - run: mix dialyzer
      - run: mix test
      - name: mix test --only integration
        if: env.TWELVEDATA_APIKEY != ''
        run: mix test --only integration

  # Releases whatever version mix.exs declares, once: bump it (and CHANGELOG.md) to cut a release.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Must match the workload identity on hex.pm; the environment only allows the main branch.
    environment: release
    permissions:
      contents: write
      # Hex workload identity: mix hex.publish exchanges the job's OIDC token for a short-lived key.
      id-token: write
    concurrency:
      group: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Check for an unreleased version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^ *version: "\(.*\)",$/\1/p' mix.exs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to Hex
        if: steps.version.outputs.release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mix deps.get
          # Skip if a previous run published but failed to create the GitHub release.
          if mix hex.info ex_twelve_data "$VERSION" > /dev/null 2>&1; then
            echo "$VERSION is already on Hex"
          else
            mix hex.publish --yes
          fi
      - name: Create GitHub release
        if: steps.version.outputs.release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '/^## \[/ { p = index($0, "## [" v "]") == 1; next } p' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
